<!DOCTYPE html>
<meta charset="utf-8">
<title>Auditar las pantallas de entrada · Silva Salud Fatiga</title>
<!--
  ══════════════════════════════════════════════════════════════════════════════════════════════
  AUDITAR LAS PANTALLAS DE ENTRADA                                              (A2b, 2026-09-02)

  QUÉ ES: mide el splash, el carrusel y el portal a seis anchos y en los dos temas.

  ⚠️ POR QUÉ EXISTE. El usuario mandó una captura de PRODUCCIÓN a 1366 px con la pantalla de entrada
  rota: media tarjeta de otra lámina asomando pegada al borde izquierdo, y un vacío enorme abajo del
  bloque de botones. A2 había auditado el PANEL —17 pantallas, 204 corridas— y dado por cubierto el
  resto. La pantalla de entrada, que es lo PRIMERO que ve cualquiera, no se miró a ancho de
  escritorio en esa auditoría.

  La lección es la misma de A1 pero un escalón más arriba: no alcanza con auditar bien lo que
  cambiaste, porque el usuario no entra por donde vos trabajaste — entra por la puerta.

  ADEMÁS mide el DESBALANCE VERTICAL, que ningún chequeo anterior miraba: un bloque con 87 px de aire
  arriba y 266 abajo no está "cortado" ni "solapado" ni tiene poco contraste. Está mal puesto, y se
  ve horrible. Ninguna de las cinco medidas del auditor lo agarraba.

  CÓMO SE USA: abrirlo con el servidor de la app en el 8928 y tocar el botón.
  ══════════════════════════════════════════════════════════════════════════════════════════════
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1rem 1.2rem; }
  iframe#app { position: fixed; left: -10000px; top: 0; width: 390px; height: 844px; border: 0; }
  button { font: inherit; padding: .5rem 1rem; cursor: pointer; }
  pre { background: #f4f4f4; padding: .8rem; overflow: auto; max-height: 70vh; font-size: 12px; }
</style>

<h1>Auditar las pantallas de entrada</h1>
<p>Splash, carrusel y portal · 6 anchos × 2 temas. Resultado en <code>window.RESULTADO</code>.</p>
<button id="ir">Auditar</button>
<pre id="out">—</pre>

<iframe id="app" title="la app, para auditarla"></iframe>

<script>
const ANCHOS = [[320,800],[375,812],[390,844],[768,1024],[1366,768],[1920,1080]];

/* Las pantallas se abren llamando a las funciones de la app. `null` = el splash tal como carga. */
const PANTALLAS = [
  { nombre: 'splash',        abrir: null,               overlay: 'splashOv' },
  { nombre: 'portal-gate',   abrir: 'splashPortal()',   overlay: 'portalOverlay' },
  /* ⚠️ SE LLAMABA `portal-demo` Y MEDÍA OTRA COSA. Desde P171, `splashVerDemo()` sin
     `DEMO_PAYLOAD` no abre el gate de la demostración: abre la HOJA DE LA CLAVE (`#demoClaveOv`).
     El nombre del informe decía «portal-demo» y lo que se auditaba era la hoja de la contraseña —
     una pantalla real, pero no la que el informe nombraba, y el gate quedaba sin auditar nunca.
     Se la llama por lo que es. El gate necesita clave y lo cubre `auditar-panel.html`. */
  { nombre: 'demo-clave',    abrir: 'splashVerDemo()', overlay: 'demoClaveOv' },
];

const log = s => { document.getElementById('out').textContent = s; };
const ev = (win, src) => win.eval(src);   // `let`/`const` de nivel superior no viven en `window`

function cargarApp(){
  return new Promise((res, rej) => {
    const f = document.getElementById('app');
    f.onload = () => res(f);
    f.onerror = () => rej(new Error('no se pudo cargar la app'));
    f.src = '../index.html?auditoria=' + Date.now();
  });
}

/* Mueve toda tira de diapositivas a su segunda lámina. Se hace por `transform` y no llamando a la
   función de la app: sirve para cualquier carrusel, incluidos los que no exponen una. */
function avanzarCarrusel(doc){
  doc.querySelectorAll('.splash-anim-track, .car-track, [class*="-track"]').forEach(t => {
    if (t.children.length < 2) return;
    t.style.transition = 'none';
    t.style.transform = 'translateX(-100%)';
  });
}

/* Aire arriba y abajo de un bloque dentro de su contenedor. Un bloque que dice "centrado" y tiene
   tres veces más aire de un lado que del otro no está centrado: está mal puesto. */
function balance(doc, selContenedor, selPrimero, selUltimo){
  const c = doc.querySelector(selContenedor);
  const a = doc.querySelector(selPrimero);
  const z = doc.querySelector(selUltimo);
  if (!c || !a || !z) return null;
  const rc = c.getBoundingClientRect();
  const arriba = Math.round(a.getBoundingClientRect().top - rc.top);
  const abajo  = Math.round(rc.bottom - z.getBoundingClientRect().bottom);
  return { arriba, abajo, peor: Math.max(arriba, abajo), mejor: Math.min(arriba, abajo) };
}

async function auditar(){
  /* ⚠️ SIN ESTO LAS 12 CORRIDAS DEL SPLASH MIDEN OTRA PANTALLA. El splash sólo se muestra a quien
     NUNCA completó su perfil (`index.html`: `if (_complete) continuarAlta(); else if
     (portalTieneSesionDeEmpresa()) portalAbrirDirecto(); else splashMostrar();`), y las dos cosas
     salen de `localStorage` — del MISMO origen que comparte con la suite y con `auditar-login.html`,
     que deja un perfil completo puesto (R18). Corriendo login y después entrada, el arranque toma
     la rama `_complete`, `#splashOv` queda en `display:none`, y el informe decía «36 corridas, 0
     hallazgos» sobre la pantalla de inicio de la app. Lo encontró el verificador, y es exactamente
     el defecto que P202 vino a cerrar, vivo otra vez.
     ⚠️ Se limpia ANTES de cargar la app: hacerlo después no sirve —el arranque ya decidió— y
     recargar el iframe para reintentarlo se lleva puesto el auditor recién inyectado. */
  log('limpiando el almacén y cargando la app…');
  try { const prev = document.getElementById('app').contentWindow;
        if (prev && prev.localStorage) prev.localStorage.clear(); } catch(e){}
  const f = await cargarApp();
  const win = f.contentWindow, doc = win.document;
  const src = await (await fetch('auditor.js?v=' + Date.now())).text();
  win.eval(src);

  /* ⚠️ ESTA HERRAMIENTA NO TENÍA NINGUNA DE LAS DOS GUARDAS. La del login ya comprobaba que la
     pantalla estuviera delante; ésta medía directo, así que una pantalla que no se abre baja el
     recuento de hallazgos y parece una mejora. Y ninguna de las tres comprobaba que el auditor
     supiera medir: son dos preguntas distintas y hacen falta las dos. */
  const fallos = win.AUDITOR.autodiagnostico(doc);
  if (fallos.length){
    log('❌ EL AUDITOR NO MIDE — no se corre nada más.\n\n' +
        'No detectó los defectos que se le plantaron a propósito:\n  · ' + fallos.join('\n  · ') +
        '\n\nUn informe de este auditor en este estado NO significa que la app esté bien.');
    return;
  }
  log('autodiagnóstico OK: el auditor detecta las cuatro familias de defecto.');

  const hallazgos = [], desbalances = [], vacias = [];
  let corridas = 0;

  for (const p of PANTALLAS){
    for (const [w, h] of ANCHOS){
      for (const tema of ['claro','oscuro']){
        f.style.width = w + 'px'; f.style.height = h + 'px';
        doc.documentElement.setAttribute('data-tema', tema);
        /* ⚠️ `sin-animaciones` SE DEJA PUESTA, y esto me lo enseñó equivocarme acá mismo.
           La primera versión la QUITABA, razonando "así se ve el estado final". Es al revés: con la
           pestaña oculta las animaciones no avanzan, así que sin esa clase los elementos animados se
           quedan en su primer fotograma, que para `.ent-texto-entra` es `opacity: 0`. Y el auditor
           saltea lo invisible. Resultado: 36 corridas, 4 hallazgos y la sensación de estar limpio,
           midiendo un splash donde el carrusel entero era invisible para la herramienta.
           La clase hace lo contrario de lo que parece: apaga las animaciones Y fuerza `opacity: 1`
           en los elementos que ellas animan (está escrito en el CSS, en el bloque de
           `html.sin-animaciones`). Es la forma de ver el estado FINAL en este entorno.
           Se vuelve a poner por si alguna pantalla la sacó. */
        doc.documentElement.classList.add('sin-animaciones');
        /* ⚠️ SE CIERRA TODO ANTES DE ABRIR LA SIGUIENTE. `auditar-login.html` ya tenía esta línea
           —«dos overlays abiertos se miden juntos y el informe diría que el defecto está en la
           pantalla equivocada»— y acá faltaba: `splashPortal()` deja `#portalOverlay` con `.show` y
           nadie se lo saca, así que las corridas de `demo-clave` medían el gate del portal Y la
           hoja de la clave juntos. Con cero hallazgos no se nota, que es el punto: un cero no
           distingue «limpio» de «medí dos veces lo mismo». */
        doc.querySelectorAll('.overlay.show').forEach(o => o.classList.remove('show'));
        if (p.abrir) { try { ev(win, p.abrir); } catch(e){} }
        else { try { win.splashMostrar(); } catch(e){} }
        /* ⚠️ EL CARRUSEL SE ADELANTA UNA LÁMINA A PROPÓSITO. En la lámina 0 no hay vecina a la
           izquierda, así que el defecto que motivó todo esto —la lámina de al lado asomando por la
           franja del relleno— NO SE VE. Medir siempre en la 0 es medir el único estado donde el bug
           no existe. Con la pestaña oculta la tira nunca avanza sola (no corren ni animaciones ni
           temporizadores), así que si no se la mueve a mano se mide siempre ese estado. */
        avanzarCarrusel(doc);
        void doc.body.offsetWidth;

        /* ⚠️ GUARDA DE COBERTURA, SOBRE EL OVERLAY QUE SE DICE AUDITAR. La primera versión miraba
           `doc.body` con `alto > 100`, y eso no puede dar falso NUNCA: `body` tiene
           `min-height:100vh` y el ancho más chico que se prueba es 768 de alto. Una guarda que
           siempre pasa es peor que no tenerla, porque se lee como verificación.
           Cada pantalla declara SU overlay: así una que no se abre se nota, y una que se abre
           encima de otra no se confunde con ella. */
        const ov = doc.getElementById(p.overlay);
        const abierto = !!ov && win.getComputedStyle(ov).display !== 'none'
                         && ov.getBoundingClientRect().height > 40;
        if (!abierto){ vacias.push(p.nombre + ' · ' + w + 'px · ' + tema); continue; }

        const r = win.AUDITOR.todo();
        corridas++;
        const donde = p.nombre + ' · ' + w + 'px · ' + tema;
        ['contraste','carruseles','cortes','solapamientos','areasDeToque','superficiesClarasEnOscuro','cortesDeTinta']
          .forEach(k => (r[k] || []).forEach(x => hallazgos.push({ tipo: k, donde, que: x })));

        if (p.nombre === 'splash' && w >= 900){
          const b = balance(doc, '.splash-wrap', '.splash-acciones', '.splash-pie');
          /* Se tolera hasta el doble: un bloque puede respirar distinto arriba que abajo sin que
             se note. Tres veces, no — eso ya se lee como "quedó pegado arriba". */
          if (b && b.peor > 40 && b.peor > b.mejor * 2){
            desbalances.push(donde + ' · columna derecha: ' + b.arriba + ' px arriba contra ' +
                             b.abajo + ' abajo');
          }
        }
        log('auditando… ' + corridas + '/' + (PANTALLAS.length * ANCHOS.length * 2) +
            ' · hallazgos: ' + hallazgos.length);
      }
    }
  }

  const unicos = {};
  hallazgos.forEach(x => {
    const k = x.tipo + ' :: ' + x.que;
    (unicos[k] = unicos[k] || { tipo: x.tipo, que: x.que, dondes: [] }).dondes.push(x.donde);
  });
  const resumen = Object.values(unicos)
    .map(u => ({ tipo: u.tipo, que: u.que, veces: u.dondes.length, ejemplo: u.dondes[0] }))
    .sort((a,b) => b.veces - a.veces);

  window.RESULTADO = { corridas, hallazgos, resumen, desbalances, vacias };
  const porTipo = {}; resumen.forEach(x => porTipo[x.tipo] = (porTipo[x.tipo]||0)+1);
  /* ⚠️ UNA GUARDA CUYO RESULTADO NO APARECE EN EL INFORME NO ES UNA GUARDA. `vacias` se llenaba y
     se quedaba en `window.RESULTADO`, que nadie mira: si una pantalla no se abre, el informe decía
     «24 corridas, 0 hallazgos» —menos hallazgos que antes, o sea que se lee como una mejora— sin
     denominador y sin advertencia. */
  log((vacias.length
        ? '⚠️ ' + vacias.length + ' de ' + (PANTALLAS.length * ANCHOS.length * 2) +
          ' corridas NO SE PUDIERON MEDIR (la pantalla no se abrió):\n  · ' +
          vacias.slice(0, 8).join('\n  · ') + (vacias.length > 8 ? '\n  · …' : '') + '\n\n'
        : '') +
      'LISTO · ' + corridas + ' de ' + (PANTALLAS.length * ANCHOS.length * 2) + ' corridas\n' +
      'hallazgos únicos: ' + resumen.length + '  ' + JSON.stringify(porTipo) + '\n' +
      'desbalances verticales: ' + desbalances.length + '\n\n' +
      JSON.stringify(resumen.slice(0,25), null, 1) + '\n\n' +
      JSON.stringify(desbalances, null, 1));
}

document.getElementById('ir').onclick = () => auditar().catch(e => log('ERROR: ' + e.message + '\n' + e.stack));
</script>
