<!DOCTYPE html>
<meta charset="utf-8">
<title>Auditar el panel · Silva Salud Fatiga</title>
<!--
  ══════════════════════════════════════════════════════════════════════════════════════════════
  AUDITAR EL PANEL — barrido de cierre de tanda                                  (A2, 2026-09-02)

  QUÉ ES: abre el panel de estadísticas en la demostración y lo mide en TODAS sus pantallas, a
  seis anchos y en los dos temas, con `pruebas/auditor.js`.

  ⚠️ POR QUÉ EXISTE, Y ES LA LECCIÓN DE A1.
  En A1 la primera corrida dio limpio y era mentira: se había auditado el inicio con todo lo demás
  CERRADO, y el propio auditor declaraba 113 textos que no podía medir — casi todos adentro de
  overlays cerrados. Los dos defectos reales estaban ahí adentro.

  El panel es peor todavía: no es un overlay que se abre, son ~20 pantallas distintas (tres vistas
  con sus pestañas) que comparten el mismo contenedor y se pintan de a una. Auditar "el panel" sin
  recorrerlas mide UNA y cree haber medido todas. Esto las recorre.

  CÓMO SE USA: abrirlo en el navegador con el servidor de la app en el 8928, y tocar el botón.
  El resultado sale por pantalla y queda en `window.RESULTADO` para inspeccionarlo.
  ══════════════════════════════════════════════════════════════════════════════════════════════
-->
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1rem 1.2rem; }
  iframe#app { position: fixed; left: -10000px; top: 0; width: 390px; height: 844px; border: 0; }
  button { font: inherit; padding: .5rem 1rem; cursor: pointer; }
  pre { background: #f4f4f4; padding: .8rem; overflow: auto; max-height: 70vh; font-size: 12px; }
</style>

<h1>Auditar el panel</h1>
<p>Recorre las pantallas del panel a 6 anchos × 2 temas. Resultado también en <code>window.RESULTADO</code>.</p>
<!-- ⚠️ La demostración pide clave desde Z1. Sin ella el auditor no abre el panel y no mide NADA:
     se escribe una vez acá y queda en este navegador (`localStorage` de 127.0.0.1). -->
<label for="clave">Clave de la demostración</label>
<input id="clave" type="password" autocomplete="off" placeholder="la que usa «Ver demostración»">
<button id="ir">Auditar</button>
<pre id="out">—</pre>

<iframe id="app" title="la app, para auditarla"></iframe>

<script>
const ANCHOS = [[320,800],[375,812],[390,844],[768,1024],[1366,800],[1920,1080]];

function log(s){ document.getElementById('out').textContent = s; }

function cargarApp(){
  return new Promise((res, rej) => {
    const f = document.getElementById('app');
    f.onload = () => res(f);
    f.onerror = () => rej(new Error('no se pudo cargar la app en el iframe'));
    f.src = '../index.html?auditoria=1';
  });
}

async function cargarAuditor(win){
  const src = await (await fetch('auditor.js?v=' + Date.now())).text();
  win.eval(src);
}

/* ⚠️ TODO lo que toque el estado de la app pasa por `win.eval`, y no es un capricho.
   `DASH` está declarado como `let DASH = null;` en el script de la app. Un `let` de nivel superior
   NO es una propiedad de `window`: vive en el ámbito del script. Desde afuera del iframe,
   `win.DASH` da `undefined` SIEMPRE — aunque el panel esté cargado y a la vista. La primera versión
   de este archivo sondeaba `win.DASH` y concluía "la demostración no cargó" con el panel abierto
   adelante. `win.eval('DASH')` sí corre adentro del ámbito del script y lo ve.
   (Las funciones sí se pueden llamar como `win.f()`: una `function` de nivel superior sí queda en
   `window`. La diferencia entre las dos mitades es exactamente esa, y no se nota hasta que
   muerde.) */
const ev = (win, src) => win.eval(src);

/* Abre la demostración y espera a que el panel tenga datos. No se puede esperar con un plazo fijo
   "por las dudas": con la pestaña oculta los temporizadores están estrangulados (ver LEEME).
   Se sondea el estado real en vez de confiar en un plazo. */
/* ⚠️ DESDE Z1 LA DEMOSTRACIÓN PIDE CLAVE, Y ESTA HERRAMIENTA NO SE ENTERÓ. El botón dispara el
   pedido, el servidor responde `motivo:'demo_pass'`, la app muestra el campo de contraseña… y el
   sondeo se quedaba mirando `DASH.registros` hasta agotar los intentos y decía «la demostración no
   cargó», que no dice nada. Es la otra mitad del hallazgo #39: el auditor no medía mal, no llegaba
   a medir — y el mensaje no permitía darse cuenta.
   Ahora: la clave se escribe UNA vez en el campo de arriba (queda en este navegador, no viaja a
   ningún lado más que al mismo endpoint al que la app se la manda), y si falta o no entra, se dice
   exactamente qué pasó. */
async function abrirDemo(win){
  const doc = win.document;
  const clave = (document.getElementById('clave').value || '').trim();
  win.splashVerDemo();

  /* ⚠️ EL CAMINO REAL CAMBIÓ EN P171 Y ESTA HERRAMIENTA SEGUÍA EN EL VIEJO. `splashVerDemo()` sin
     `DEMO_PAYLOAD` NO abre el portal: abre la hoja de la clave (`#demoClaveOv`, con `#dcPass` y
     `demoClaveEnviar`). La versión anterior escribía en `#pDemoPass` y tocaba `#portalDemoBtn`, que
     viven DENTRO de `#portalOverlay` y estaban ocultos; `portalVerDemo` corría igual y `onDashData`
     llenaba `DASH`, así que el sondeo de `DASH.registros` daba OK… con el portal en `display:none`.
     Medido por el verificador: 108 corridas midiendo el splash y la hoja de la clave, informe
     «limpio», y el sello «autodiagnóstico OK» adelante. Era el #39 vuelto a abrir y peor, porque
     ahora venía firmado. Sólo `splashAbrirPortal()` le pone `.show` al portal, y a eso se llega
     por `demoClaveEnviar` → `demoAbrirGate`. */
  const hoja = doc.getElementById('demoClaveOv');
  if (hoja && hoja.classList.contains('show')){
    if (!clave) throw new Error(
      'la demostración pide clave: escribila en el campo de arriba y volvé a correr. ' +
      'Sin eso el auditor NO mide nada, y un informe vacío no significa que la app esté bien.');
    doc.getElementById('dcPass').value = clave;
    win.demoClaveEnviar(doc.querySelector('#demoClaveOv .save-btn') || doc.createElement('button'));
    for (let i = 0; i < 150; i++){
      if (doc.getElementById('portalOverlay').classList.contains('show')) break;
      const err = doc.getElementById('dcErr');
      if (err && err.textContent.trim())
        throw new Error('la clave de la demostración no entró: «' + err.textContent.trim() + '»');
      await new Promise(r => setTimeout(r, 100));
    }
  }
  if (!doc.getElementById('portalOverlay').classList.contains('show'))
    throw new Error('el portal no se abrió · sin él el panel queda dentro de un `display:none` y ' +
                    'todo lo que se mida después es el splash, no el panel');

  /* Ya con el portal abierto y el payload en memoria, el botón del gate no viaja. */
  const btn = [...doc.querySelectorAll('button')]
    .find(b => /Ver demostración con datos simulados/.test(b.textContent));
  if (!btn) throw new Error('no se encontró el botón de la demostración en el gate');
  btn.click();
  for (let i = 0; i < 100; i++){
    if (ev(win, 'DASH && DASH.registros ? 1 : 0') && panelEnPantalla(win)) return;
    const err = doc.getElementById('portalDemoErr');
    if (err && err.textContent.trim())
      throw new Error('el servidor rechazó la demostración: «' + err.textContent.trim() + '»');
    await new Promise(r => setTimeout(r, 100));
  }
  /* ⚠️ Que `DASH` tenga datos NO alcanza: el defecto que esto cierra es exactamente «hay datos y el
     panel no está en pantalla». */
  throw new Error(ev(win, 'DASH && DASH.registros ? 1 : 0')
    ? 'el panel tiene datos pero NO está en pantalla (' + panelRect(win) + ') · no se audita nada'
    : 'la demostración no cargó y el servidor no dijo por qué');
}

/* El rectángulo del panel, que es lo que de verdad se audita. Si mide 0, lo que haya medido el
   auditor es OTRA pantalla. */
function panelRect(win){
  const el = win.document.getElementById('dashScroll') || win.document.getElementById('portalDash');
  if (!el) return 'sin #dashScroll';
  const r = el.getBoundingClientRect();
  return Math.round(r.width) + '×' + Math.round(r.height);
}
function panelEnPantalla(win){
  const el = win.document.getElementById('dashScroll') || win.document.getElementById('portalDash');
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return r.width > 50 && r.height > 50;
}


/* Todas las pantallas del panel: cada vista con sus pestañas reales, preguntándoselas a la app
   (`dashTabsFor`) en vez de escribir la lista a mano — si mañana aparece una pestaña nueva, entra
   sola en la auditoría. Ese fue el modo de fallar de A1: una lista escrita a mano no sabe lo que
   no le contaron. */
function pantallas(win){
  const out = [];
  ['supervisor','medico','hseq'].forEach(vista => {
    ev(win, 'dashTabsFor(DASH.rol, false, ' + JSON.stringify(vista) + ')')
      .forEach(tab => out.push({ vista, tab }));
  });
  return out;
}

function pintar(win, vista, tab){
  ev(win,
    'DASH.tabs = dashTabsFor(DASH.rol, false, ' + JSON.stringify(vista) + ');' +
    'DASH.vista = ' + JSON.stringify(vista) + ';' +
    'DASH.tab = ' + JSON.stringify(tab) + ';' +
    'buildDashFilters(); renderDash();' +
    /* ⚠️ `renderDash` deja las mediciones que dependen del layout en `requestAnimationFrame`, y
       rAF NO CORRE con la pestaña oculta — que es como corre siempre este entorno (ver LEEME).
       Sin esto, el auditor mide un panel al que todavía no se le aplicó el desplazamiento y
       reporta como cortado algo que en el navegador de una persona ya se estaría deslizando.
       Es la misma clase de trampa que las animaciones: no es que esté roto, es que este entorno
       no llegó a ejecutarlo. */
    'dashWireAnResMarquee(); dashWireMarquees();');
}

async function auditar(){
  log('cargando la app…');
  const f = await cargarApp();
  const win = f.contentWindow;
  await cargarAuditor(win);
  log('abriendo la demostración…');
  await abrirDemo(win);

  /* ⚠️ EL AUDITOR TIENE QUE DEMOSTRAR QUE MIDE, ANTES DE INFORMAR NADA. Un recuento en cero
     significa dos cosas opuestas —«está limpio» o «no miré nada»— y esta herramienta ya informó
     «0 hallazgos» sin medir: la sección tenía un ancestro en `display:none` y las 108 corridas
     dieron listas vacías. Se leyó como una auditoría limpia y quedó abierto como el hallazgo #39.
     Acá se plantan cuatro defectos de las cuatro familias que el auditor busca y se exige que los
     encuentre. Si no los encuentra, el informe entero no vale y se dice: es preferible no tener
     auditoría a tener una que dice que todo está bien. */
  const fallos = win.AUDITOR.autodiagnostico(win.document);
  if (fallos.length){
    log('❌ EL AUDITOR NO MIDE — no se corre nada más.\n\n' +
        'No detectó los defectos que se le plantaron a propósito:\n  · ' + fallos.join('\n  · ') +
        '\n\nUn informe de este auditor en este estado NO significa que la app esté bien.');
    return;
  }
  log('autodiagnóstico OK: el auditor detecta las cuatro familias de defecto.');

  const lista = pantallas(win);
  const hallazgos = [];
  const sinMedir = [];
  const noMedidas = [];
  let corridas = 0;

  for (const p of lista){
    for (const [w, h] of ANCHOS){
      for (const tema of ['claro','oscuro']){
        f.style.width = w + 'px'; f.style.height = h + 'px';
        win.document.documentElement.setAttribute('data-tema', tema);
        pintar(win, p.vista, p.tab);
        void win.document.body.offsetWidth;
        const r = win.AUDITOR.todo();
        corridas++;
        const donde = p.vista + '/' + p.tab + ' · ' + w + 'px · ' + tema;
        ['contraste','superficiesClarasEnOscuro','cortes','solapamientos','areasDeToque','cortesDeTinta'].forEach(k => {
          (r[k] || []).forEach(x => hallazgos.push({ tipo: k, donde, que: x }));
        });
        /* `sinPoderMedir` es un NÚMERO, no una lista (así lo devuelve `AUDITOR.contraste`). Y es el
           dato que en A1 destapó que la auditoría "limpia" cubría media app: un recuento alto de
           textos que no se pudieron medir es un resultado, no un cero. Se guarda por pantalla.
           ⚠️ PERO NO TODO LO QUE NO SE MIDE ES COBERTURA PERDIDA, y conviene saberlo antes de
           salir a buscar un problema que no existe. Medido en P111 sobre `hseq/idc`, el peor:
           de 539 elementos con texto que no se pudieron medir, 537 eran de OTRAS SECCIONES del
           panel —el panel las pinta todas y muestra una— y sólo 2 eran `<script>`. Cada una de
           esas secciones se mide cuando le toca su turno en el recorrido de las 18 pantallas.
           O sea: un número de tres cifras acá es NORMAL. Lo que valdría la pena mirar es que suba
           mucho en UNA pantalla respecto de las demás. */
        if (r.sinPoderMedir) sinMedir.push({ donde, n: r.sinPoderMedir });
        /* ⚠️ LA COBERTURA SE MIRA SOBRE EL PANEL, NO SOBRE EL DOCUMENTO. `r.medidos` cuenta todo
           lo visible, y con el portal cerrado eso son el splash y la hoja de la clave: 42 textos
           medidos, la guarda no dispara, y el informe sale «limpio» de una pantalla que no es la
           auditada. Es el escenario exacto que midió el verificador. Que el panel tenga rectángulo
           es lo único que distingue «está limpio» de «no lo miré». */
        if (!r.medidos || !panelEnPantalla(win)) noMedidas.push(donde + ' · panel ' + panelRect(win));
        log('auditando… ' + corridas + '/' + (lista.length * ANCHOS.length * 2) +
            ' · hallazgos: ' + hallazgos.length);
      }
    }
  }

  /* Se agrupa por hallazgo ÚNICO: el mismo defecto aparece en muchas combinaciones y contarlo
     tantas veces exagera el problema. Lo que importa es cuántas cosas distintas hay que arreglar,
     y en qué anchos/temas aparece cada una. */
  /* ⚠️ POR CAUSA, NO POR CONTENIDO. La agrupación de arriba ya lo decía y no lo cumplía para el
     contraste: la clave incluía el texto medido, así que un solo color mal contrastado aparecía
     una vez por cada número que hubiera en pantalla. Informaba 47 donde había 6. */
  const unicos = {};
  hallazgos.forEach(h => {
    const causa = win.AUDITOR.causaDe(h.que);
    const k = h.tipo + ' :: ' + causa;
    (unicos[k] = unicos[k] || { tipo: h.tipo, que: causa, textos: new Set(), dondes: [] });
    unicos[k].dondes.push(h.donde);
    const m = String(h.que).match(/⟨(.*)⟩$/);
    if (m) unicos[k].textos.add(m[1]);
  });
  const resumen = Object.values(unicos)
    .map(u => ({ tipo: u.tipo, que: u.que, veces: u.dondes.length, ejemplo: u.dondes[0],
                 /* Cuántos contenidos distintos tapaba esa causa: si dice 40, ahí está la
                    diferencia entre el número viejo y el nuevo. */
                 textos: u.textos.size, muestra: [...u.textos].slice(0, 3) }))
    .sort((a, b) => b.veces - a.veces);
  const picoSinMedir = sinMedir.sort((a, b) => b.n - a.n)[0] || null;

  window.RESULTADO = { corridas, pantallas: lista.length, hallazgos, sinMedir, resumen, noMedidas };
  log((noMedidas.length
        ? '⚠️ ' + noMedidas.length + ' de ' + corridas + ' corridas NO MIDIERON NADA — su cero no cuenta:\n  · ' +
          noMedidas.slice(0, 8).join('\n  · ') + (noMedidas.length > 8 ? '\n  · …' : '') + '\n\n'
        : '') +
      'LISTO · ' + corridas + ' corridas sobre ' + lista.length + ' pantallas\n' +
      'hallazgos únicos: ' + resumen.length + '  (brutos: ' + hallazgos.length + ')\n' +
      'pico de textos que no se pudieron medir: ' +
        (picoSinMedir ? picoSinMedir.n + ' en ' + picoSinMedir.donde : '0') + '\n\n' +
      JSON.stringify(resumen.slice(0, 40), null, 1));
}

/* La clave se recuerda para no tener que pegarla en cada corrida. Es `127.0.0.1`: no sale de esta
   máquina, y es la misma que la app le manda al endpoint.
   ⚠️ EN `sessionStorage`, NO EN `localStorage`. La suite comparte origen con esta herramienta y
   tiene 178 `localStorage.clear()` repartidos en sus casos (R18): guardarla ahí significaba que
   correr la suite entre dos auditorías te borraba la clave, sin decir por qué. Ninguno de los casos
   toca `sessionStorage`. */
const K_CLAVE_AUD = 'silva_auditor_demo_pass';
try { document.getElementById('clave').value = sessionStorage.getItem(K_CLAVE_AUD) || ''; } catch(e){}
document.getElementById('ir').onclick = () => {
  try { sessionStorage.setItem(K_CLAVE_AUD, document.getElementById('clave').value || ''); } catch(e){}
  auditar().catch(e => log('ERROR: ' + e.message + '\n' + e.stack));
};
</script>
